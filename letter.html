<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Love Letter ❤️</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 88 C25 65 5 45 5 25 C5 10 20 5 30 15 L50 35 L70 15 C80 5 95 10 95 25 C95 45 75 65 50 88Z' fill='%23ff4f9a'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Caveat:wght@700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/letter.css?v=9">

<link rel="stylesheet" href="css/cursor.css">

<link rel="stylesheet" href="css/common.css">

</head>

<body>

<!-- Music -->

<audio id="bgMusic" loop preload="auto">
    <source src="assets/music/birthday.mp3" type="audio/mp3">
</audio>

<button id="musicBtn">🔇</button>

<div class="background"></div>

<div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open your birthday letter">

<div class="flap"></div>

<div class="body"></div>

<div class="stamp" aria-hidden="true">✉</div>

<div class="seal" aria-hidden="true">&#10084;</div>

</div>

<div class="paper" id="paper">

<h1>To My Beautiful Wife <span class="emoji">❤️</span></h1>

<p id="letterText"></p>

<button id="nextBtn">

Continue <span class="emoji">❤️</span>

</button>

</div>

<script src="js/letter.js?v=2"></script>

<script src="js/music.js"></script>

<div id="cursor"></div>

<script src="js/cursor.js"></script>

<script src="js/common.js"></script>

</body>

</html>
