<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday ❤️</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 88 C25 65 5 45 5 25 C5 10 20 5 30 15 L50 35 L70 15 C80 5 95 10 95 25 C95 45 75 65 50 88Z' fill='%23ff4f9a'/%3E%3C/svg%3E">

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="css/style.css">

    <link rel="stylesheet"
        href="css/animations.css">

    <link rel="stylesheet"
        href="css/responsive.css">

<link rel="stylesheet" href="css/cursor.css">
<link rel="stylesheet" href="css/common.css?v=2">

</head>

<body>

    <!-- Animated Background -->

    <canvas id="stars"></canvas>

    <div class="overlay"></div>

    <!-- Music -->

    <audio id="bgMusic" loop preload="auto">
        <source src="assets/music/birthday.mp3" type="audio/mp3">
    </audio>

    <!-- Music Button -->

    <button id="musicBtn">
        🔊
    </button>

    <!-- Main -->

    <main>

        <h2 class="smallTitle">
            A Surprise For
        </h2>

        <h1 class="title">
            My Beautiful Wife <span class="emoji">❤️</span>
        </h1>

        <p class="subtitle">

            Every second with you is magical.

            Tonight I made something special...

        </p>

        <div class="countdown">

            <div>

                <span id="days">00</span>

                <small>Days</small>

            </div>

            <div>

                <span id="hours">00</span>

                <small>Hours</small>

            </div>

            <div>

                <span id="minutes">00</span>

                <small>Minutes</small>

            </div>

            <div>

                <span id="seconds">00</span>

                <small>Seconds</small>

            </div>

        </div>

        <p id="birthdayMessage" class="celebrationText" aria-live="polite"></p>

        <button id="beginBtn">

            Begin Your Surprise <span class="emoji">❤️</span>

        </button>

    </main>

    <!-- Floating Hearts -->

    <div id="hearts"></div>

    <script src="js/stars.js"></script>

    <script src="js/countdown.js"></script>

    <script src="js/music.js"></script>

    <script src="js/app.js"></script>

<div id="cursor"></div>

<script src="js/cursor.js"></script>

<script src="js/common.js?v=2"></script>

</body>

</html>
