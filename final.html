<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forever & Always ❤️</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 88 C25 65 5 45 5 25 C5 10 20 5 30 15 L50 35 L70 15 C80 5 95 10 95 25 C95 45 75 65 50 88Z' fill='%23ff4f9a'/%3E%3C/svg%3E">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cursor.css">
    <link rel="stylesheet" href="css/final.css">
    <link rel="stylesheet" href="css/common.css">

</head>

<body>

    <!-- Music -->

    <audio id="bgMusic" loop preload="auto">
        <source src="assets/music/birthday.mp3" type="audio/mp3">
    </audio>

    <button id="musicBtn">🔇</button>

    <canvas id="heartsCanvas"></canvas>

    <div class="container">

        <h1 class="title">❤️ I Love You ❤️</h1>

        <p class="subtitle">
            Happy Birthday, My Love.
            <br><br>
            Thank you for walking through this little journey with me.
            Every memory, every smile, every laugh we've shared has made my life more beautiful.
            <br><br>
            I promise to keep making memories with you forever.
        </p>

        <div class="buttons">

            <button id="restartBtn">
                ❤️ Experience Again
            </button>

            <button id="downloadBtn">
                📥 Download Our Memories
            </button>

        </div>

    </div>

    <div id="cursor"></div>

    <script src="js/final.js"></script>

    <script src="js/music.js"></script>

    <script src="js/cursor.js"></script>
    
    <script src="js/common.js"></script>

</body>

</html>
