<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Find Our Hearts ❤️</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 88 C25 65 5 45 5 25 C5 10 20 5 30 15 L50 35 L70 15 C80 5 95 10 95 25 C95 45 75 65 50 88Z' fill='%23ff4f9a'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/cursor.css">

<link rel="stylesheet" href="css/common.css?v=2">

<body>

<!-- Music -->

<audio id="bgMusic" loop preload="auto">
    <source src="assets/music/birthday.mp3" type="audio/mp3">
</audio>

<button id="musicBtn">🔇</button>

<div class="background"></div>

<header>

<h1><span class="emoji">❤️</span> Catch the Moving Hearts <span class="emoji">❤️</span></h1>

<p>

Move your cursor over a heart and click to catch it. They won't run away.

</p>

</header>

<div id="score">

0 / 10 Found

</div>

<div id="gameArea">
  <div id="gameHint">Move your cursor over a heart and click to catch it. They won't run away.</div>
</div>

<div id="completed">

<h2><span class="emoji">❤️</span> You Found Them All <span class="emoji">❤️</span></h2>

<p>

One last surprise is waiting...

</p>

<button id="unlock">

Unlock Love Letter <span class="emoji">💌</span>

</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<script src="js/common.js?v=2"></script>

<script src="js/game.js"></script>

<script src="js/music.js"></script>

<div id="cursor"></div>

<script src="js/cursor.js"></script>
