<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<body>

<!-- Music -->

<audio id="bgMusic" loop preload="auto">
    <source src="assets/music/birthday.mp3" type="audio/mp3">
</audio>

<button id="musicBtn">🔇</button>

<div class="background"></div>

<h1 class="cake-title">🎂 Happy Birthday My Love ❤️</h1>

<div class="cake-container">

<div class="cake">

<div class="top"></div>

<div class="middle"></div>

<div class="bottom"></div>

<div class="candles">

<div class="candle">
<div class="flame"></div>
<div class="glow"></div>
</div>

<div class="candle">
<div class="flame"></div>
<div class="glow"></div>
</div>

<div class="candle">
<div class="flame"></div>
<div class="glow"></div>
</div>

</div>

<div class="decorations">

<div class="sprinkle"></div>
<div class="sprinkle"></div>
<div class="sprinkle"></div>
<div class="sprinkle"></div>
<div class="sprinkle"></div>

</div>

</div>

</div>

<button id="blow" class="blow-btn">

💨 Blow the Candles

</button>

<div id="wish" class="wish-container">

<h2 class="wish-title">✨ Make a Wish ✨</h2>

<p class="wish-text">

May every birthday be brighter than the last,
and may I always be by your side.

Happy Birthday ❤️

</p>

<button id="finish" class="finish-btn">

Our Final Surprise →

</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<script src="js/common.js"></script>

<script src="js/music.js"></script>

<div id="cursor"></div>

<script src="js/cursor.js"></script>
